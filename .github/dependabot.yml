# Dependabot version updates.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /npmjs
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      # madge@8.0.0 still declares peerOptional typescript@^5.4.4 (pahen/madge#462).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Keep Node types on the CI runtime (Node 22 in .github/workflows/ci.yml).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Ruby version for resolution comes from rubygems/pray-cli/.ruby-version (3.4),
  # matching .github/workflows/ci.yml. Without that file Dependabot used the gemspec
  # floor (>= 3.1) and failed to resolve polyrun / bundler-audit / rbs.
  - package-ecosystem: bundler
    directory: /rubygems/pray-cli
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
    groups:
      bundler:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
