# Dependabot version updates.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /npmjs/pray-cli
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: bundler
    directory: /rubygems/pray-cli
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
    groups:
      bundler:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
