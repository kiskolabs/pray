# Publish @kiskolabs/pray-core then @kiskolabs/pray-cli to jsr.io with OIDC provenance.
# Prerequisites: packages linked to this GitHub repository in JSR settings.
# Trigger manually after version bump; skips each package when that version is already published.
name: Publish JSR

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: npmjs/package-lock.json
      - name: Assert npm and jsr versions match
        run: ./scripts/release/versions_test.sh
      - name: Check which packages need publish
        id: registry
        run: |
          set -euo pipefail
          # shellcheck source=scripts/release/common.sh
          source ./scripts/release/common.sh
          # shellcheck source=scripts/release/registry_status.sh
          source ./scripts/release/registry_status.sh
          version="$(release_read_jsr_version "$(pwd)")"
          core_skip=no
          cli_skip=no
          if release_jsr_has_version "@kiskolabs/pray-core" "${version}"; then
            core_skip=yes
            echo "skip @kiskolabs/pray-core@${version} (already on jsr.io)"
          fi
          if release_jsr_has_version "@kiskolabs/pray-cli" "${version}"; then
            cli_skip=yes
            echo "skip @kiskolabs/pray-cli@${version} (already on jsr.io)"
          fi
          echo "core_skip=${core_skip}" >> "${GITHUB_OUTPUT}"
          echo "cli_skip=${cli_skip}" >> "${GITHUB_OUTPUT}"
          if [[ "${core_skip}" == "yes" && "${cli_skip}" == "yes" ]]; then
            echo "skip_all=yes" >> "${GITHUB_OUTPUT}"
          else
            echo "skip_all=no" >> "${GITHUB_OUTPUT}"
          fi
      - name: Install npm dependencies
        if: steps.registry.outputs.skip_all != 'yes'
        working-directory: npmjs
        run: npm ci
      - name: Publish pray-core to jsr.io
        if: steps.registry.outputs.core_skip != 'yes'
        working-directory: npmjs/pray-core
        run: npx --yes jsr publish
      - name: Publish pray-cli to jsr.io
        if: steps.registry.outputs.cli_skip != 'yes'
        working-directory: npmjs/pray-cli
        run: npx --yes jsr publish
