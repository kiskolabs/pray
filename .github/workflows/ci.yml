name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check source file LOC limits
        run: make loc-check
      - name: Check GitHub release changelog notes
        run: ./scripts/release/changelog_test.sh
      - name: Check coordinated release versions
        run: ./scripts/release/versions_test.sh
      - name: Check crates.io already-published skip
        run: ./scripts/release/crates_status_test.sh
      - name: Check npm RubyGems jsr already-published skip
        run: ./scripts/release/registry_status_test.sh
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check RFC id reservations
        run: cargo test -p pray-core --test rfc_ids
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses bans sources
      - name: Install cargo-machete
        run: cargo install cargo-machete --locked
      - name: Check unused dependencies
        run: cargo machete
      - name: Run Rust tests
        run: cargo test --workspace
      - name: Check managed instructions for drift
        env:
          PRAY_NO_VERSION_CHECK: "1"
        run: |
          cargo run -q -p pray-cli -- drift && status=0 || status=$?
          case $status in
            0) ;;
            6) echo "::error::AGENTS.md has drifted from .agents/. Run 'pray install' and commit the result."; exit 1 ;;
            *) echo "::error::pray drift could not run (exit $status) - infrastructure, not drift."; exit 1 ;;
          esac
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-llvm-cov
      - name: Rust coverage floor
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info --fail-under-lines 65
      - name: Install cargo-mutants
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-mutants
      - name: Mutation smoke on manifest and archive boundaries
        run: >
          cargo mutants -p pray-core --timeout 60 --jobs 2
          -f 'manifest_validate.rs' -f 'package_archive.rs'
          -F '(manifest_validate.rs.*replace != with ==|package_archive.rs:12:36: replace > with ==)'
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: rubygems/pray-cli
      - name: Check RubyGems release environment isolation
        run: bash scripts/release/rubygems_environment_test.sh
      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Audit Ruby dependencies
        working-directory: rubygems/pray-cli
        run: bundle exec bundler-audit check --update
      - name: Run Ruby lint
        working-directory: rubygems/pray-cli
        run: make lint
      - name: Run Ruby tests with coverage
        working-directory: rubygems/pray-cli
        env:
          POLYRUN_COVERAGE: "1"
        run: bundle exec polyrun parallel-rspec --workers 5 --merge-failures

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: npmjs/package-lock.json
      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Install npm dependencies
        working-directory: npmjs
        run: npm ci
      - name: Audit production npm dependencies
        working-directory: npmjs/pray-core
        run: npm audit --omit=dev
      - name: Audit all npm dependencies
        working-directory: npmjs
        run: npm audit
      - name: Run pray-core tests with coverage
        working-directory: npmjs/pray-core
        run: npm run test:coverage
      - name: Run pray-cli tests
        working-directory: npmjs/pray-cli
        run: npm test
      - name: Run pray-core lint
        working-directory: npmjs/pray-core
        run: npm run lint
      - name: Run pray-cli lint
        working-directory: npmjs/pray-cli
        run: npm run lint
      - name: Check JSR publish for pray-core (no slow types)
        working-directory: npmjs/pray-core
        run: npx --yes jsr publish --dry-run --allow-dirty
