name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check source file LOC limits
        run: make loc-check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
      - name: Install cargo-machete
        run: cargo install cargo-machete --locked
      - name: Check unused dependencies
        run: cargo machete
      - name: Run Rust tests
        run: cargo test --workspace
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Rust coverage soft floor
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info --fail-under-lines 20
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Mutation smoke on parser and integrity
        continue-on-error: true
        run: >
          cargo mutants -p pray-core --timeout 30 --jobs 2
          -f 'manifest.rs' -f 'package_spec.rs' -f 'dependency_graph.rs'
          -f 'package_integrity.rs' -f 'package_archive.rs' -f 'paths.rs'
      - uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: rubygems/pray-cli
      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Run Ruby lint
        working-directory: rubygems/pray-cli
        run: make lint
      - name: Run Ruby tests with coverage
        working-directory: rubygems/pray-cli
        env:
          POLYRUN_COVERAGE: "1"
        run: bundle exec polyrun parallel-rspec --workers 5 --merge-failures

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: npmjs/pray-cli/package-lock.json
      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Install npm dependencies
        working-directory: npmjs/pray-cli
        run: npm ci
      - name: Run npm tests
        working-directory: npmjs/pray-cli
        run: npm test
      - name: Run npm lint
        working-directory: npmjs/pray-cli
        run: npm run lint
