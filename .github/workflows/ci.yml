name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check source file LOC limits
        run: make loc-check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check RFC id reservations
        run: cargo test -p pray-core --test rfc_ids
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses bans sources
      - name: Install cargo-machete
        run: cargo install cargo-machete --locked
      - name: Check unused dependencies
        run: cargo machete
      - name: Run Rust tests
        run: cargo test --workspace
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-llvm-cov
      - name: Rust coverage soft floor
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info --fail-under-lines 20
      - name: Install cargo-mutants
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-mutants
      - name: Mutation smoke on parser and integrity
        continue-on-error: true
        run: >
          cargo mutants -p pray-core --timeout 30 --jobs 2
          -f 'manifest.rs' -f 'package_spec.rs' -f 'dependency_graph.rs'
          -f 'package_integrity.rs' -f 'package_archive.rs' -f 'paths.rs'
      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: rubygems/pray-cli
      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Audit Ruby dependencies
        working-directory: rubygems/pray-cli
        run: bundle exec bundler-audit check --update
      - name: Run Ruby lint
        working-directory: rubygems/pray-cli
        run: make lint
      - name: Run Ruby tests with coverage
        working-directory: rubygems/pray-cli
        env:
          POLYRUN_COVERAGE: "1"
        run: bundle exec polyrun parallel-rspec --workers 5 --merge-failures

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: npmjs/pray-cli/package-lock.json
      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Install npm dependencies
        working-directory: npmjs/pray-cli
        run: npm ci
      - name: Audit production npm dependencies
        working-directory: npmjs/pray-cli
        run: npm audit --omit=dev
      - name: Audit all npm dependencies
        working-directory: npmjs/pray-cli
        run: npm audit
      - name: Run npm tests
        working-directory: npmjs/pray-cli
        run: npm test
      - name: Run npm lint
        working-directory: npmjs/pray-cli
        run: npm run lint
