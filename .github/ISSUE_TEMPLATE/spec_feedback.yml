name: Specification Feedback
description: Propose a change or clarification to a contract RFC.
title: "[RFC]: "
labels: ["spec", "triage"]
body:
  - type: markdown
    attributes:
      value: "Please ensure your reporting is accurate and balanced. Verify details before submitting."
  - type: textarea
    id: section
    attributes:
      label: RFC number or topic
      description: Cite the RFC when possible (for example RFC 0020 lockfile hashing).
      placeholder: e.g. RFC 0020 lockfile hashing, RFC 0030 render targets, RFC 0060 distribution
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is unclear, inconsistent, or missing? Be specific and avoid generalizations.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Wording or Behavior
      description: Optional preferred clarification or behavior.
    validations:
      required: false
  - type: checkboxes
    id: automation_check
    attributes:
      label: Automation Safety
      options:
        - label: I certify that this report does not contain private keys or PII (Security Measures).
          required: true
