[workspace]
members = [
  "crates/pray-core",
  "crates/pray-cli",
  "crates/pray-transport",
  "crates/pray-bench",
]
resolver = "2"

[workspace.package]
version = "1.9.0"
edition = "2021"
license = "MIT"
authors = ["Andrei Makarov <contact@kiskolabs.com>"]
repository = "https://github.com/kiskolabs/pray"
homepage = "https://pray.kisko.dev"

[workspace.dependencies]
pray-core = { version = "1.9.0", path = "crates/pray-core", default-features = false }
pray-transport = { version = "1.9.0", path = "crates/pray-transport" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
