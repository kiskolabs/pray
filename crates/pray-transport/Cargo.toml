[package]
name = "pray-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "HTTP and federation transports for Prayfile distribution points"
readme = "README.md"
documentation = "https://docs.rs/pray-transport"
keywords = ["pray", "prayfile", "transport", "federation", "http"]
categories = ["network-programming", "development-tools"]

[dependencies]
async-trait = "0.1"
anyhow = "1"
pray-core = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "rt-multi-thread"] }

[features]
default = ["http"]
http = []
p2p = []
torrent = []
filesystem = []
all = ["http", "p2p", "torrent", "filesystem"]

[dev-dependencies]
tokio-test = "0.4"
