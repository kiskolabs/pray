[package]
name = "pray-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core library for Prayfile, the package manager for the language placed before inference"
readme = "README.md"
documentation = "https://docs.rs/pray-core"
keywords = ["pray", "prayfile", "agents", "inference", "lockfile"]
categories = ["development-tools", "parser-implementations"]
[features]
default = ["auth"]
auth = ["dep:rusqlite"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.11"
base64 = "0.23"
ed25519-dalek = "3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"], optional = true }
tar = "0.4"
toml = "1.1"
zstd = "0.13"

[dev-dependencies]
ed25519-dalek = "3"
jsonschema = "0.52"
proptest = "1"
