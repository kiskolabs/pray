[package]
name = "pray-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Benchmarks for pray-core operations"
publish = false

[dependencies]
pray-core = { workspace = true, features = ["auth"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "operations"
harness = false

[[bench]]
name = "index"
harness = false
